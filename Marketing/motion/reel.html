<!doctype html>
<html lang="en">
<head>

<title>#stayGRUBBY Reel</title>
<link rel="stylesheet" href="../../Website/site.css">

</head>
<body>
<div id="stage"></div>
<script src="build/assets.js"></script>
<script src="motion.js"></script>
<script src="reels.js"></script>
<script>
  // reel.html?reel=<id>&t=<seconds> — open in a browser to scrub; capture.mjs drives window.seek().
  const q = new URLSearchParams(location.search);
  buildReel(REELS[q.get('reel')]());
  if (q.get('t')) window.seek(parseFloat(q.get('t')));
</script>
</body>
